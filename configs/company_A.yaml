# Company A: mining operations, two systems (SAP ERP goods receipts + AP invoice tool).
# DRAFT (stage 0): column mapping only. Status values, exclusion rules and
# matching settings are filled in after data exploration (stage 1+).

company: A
reporting_currency: ZAR
# Relative to this config file. Override with --data-dir for blind-test files.
data_dir: ../../company_A

taxonomy:
  file: taxonomy_A.csv

# Labels are used ONLY by the eval harness, never by the pipeline itself.
labels:
  file: labels_A.csv
  id_column: record_id

sources:
  - name: ERP
    file: erp_goods_receipts.csv
    role: primary              # ERP record wins when the same purchase is in both
    id_prefix: "ERP:"
    columns:
      record_id: line_id
      amount: value_zar        # already net of VAT
      date: posting_date
      posting_date: posting_date
      supplier: supplier_name
      supplier_id: vendor_id
      description: [material_short_text, service_short_text]
      item_code: material_number
      quantity: quantity
      uom: uom
      cost_centre: cost_centre
      po_number: po_number
      po_line: po_item
      currency: document_currency
      site: site_name
    date_formats: ["%Y-%m-%d"]
    amount:
      gross: false
    currency:
      fixed: ZAR               # value_zar is ZAR even when document_currency is EUR/CHF/MZN

  - name: TOOL
    file: invoice_tool_export.csv
    role: secondary            # excluded as DUPLICATE when it matches an ERP record
    id_prefix: "TOOL:"
    columns:
      record_id: tool_record_id
      amount: gross_amount     # gross: VAT removed in cleaning
      date: invoice_date
      supplier: supplier_name_as_captured
      description: line_text
      quantity: quantity
      po_number: po_reference
      invoice_number: invoice_number
      vat_rate: vat_rate
      currency: currency
      status: status
    # Seen: 27/03/2023 (day first: part 1 > 12 in 2,050 rows), 2023-03-27, 27-Mar-24
    date_formats: ["%d/%m/%Y", "%Y-%m-%d", "%d-%b-%y"]
    dayfirst: true
    # Seen: Paid, Approved, Cancelled, On Hold, Rejected. These are all in the
    # built-in multilingual status lists; listed here so the rule is visible.
    status:
      include: [Paid, Approved]
      CANCELLED: [Cancelled]
      NOT_APPROVED: [On Hold, Rejected]
      unknown_means: NOT_APPROVED   # brief: only approved or paid count
    amount:
      gross: true
      default_vat_rate: 0.15   # brief: if VAT rate is blank, use 15%
    currency:
      fixed: ZAR

# Dates outside this window are flagged DATE_IMPLAUSIBLE (data covers 2021-2024).
dates:
  min: "2019-01-01"
  max: "2025-12-31"

matching:
  enabled: true
  primary: ERP                 # counted
  secondary: TOOL              # DUPLICATE when it matches an ERP line
  po_pattern: "(\\d{10})"      # ERP POs are always 10 digits
  amount_tol_abs: 0.05         # ZAR; VAT division leaves cent-level rounding
  amount_tol_rel: 0.001
  text_threshold: 75
  supplier_threshold: 85
  # True duplicates: invoice date is within 22 days of the ERP posting date
  # for 90% of PO-matched pairs, so 31 days is a safe window.
  date_window_days: 31
  # A tool PO that is not in the ERP = tool-only spend: never fall back to
  # supplier+amount for it (those look-alikes are coincidences).
  fallback_only_without_po: true
  require_same_quantity: true
  passes: [po_line_amount, po_amount, po_text, supplier_amount, po_text_any]
