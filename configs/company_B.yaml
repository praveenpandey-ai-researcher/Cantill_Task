# Company B: metal packaging, one AP invoice-line file from 8 ERPs, 25 currencies.
# DRAFT (stage 0): column mapping only. Status / exclusion rules come after
# data exploration (stage 1+).

company: B
reporting_currency: USD
data_dir: ../../company_B

taxonomy:
  file: taxonomy_B.csv

# Seed labels: analyst-made, "useful, not perfect". Eval only.
labels:
  file: seed_labels.csv
  id_column: line_id

fx:
  table_file: fx_rates_usd.csv
  # currency_rate and the table are "units of line currency per 1 USD",
  # so USD amount = line amount / rate.
  rate_meaning: units_per_reporting
  # A given currency_rate more than 5x away from the table rate for that
  # currency and month is a data error (55 EUR lines carry an MXN-sized rate);
  # the table rate is used instead. 5x leaves room for real devaluations (ARS).
  max_rate_deviation: 5

sources:
  - name: INV
    file: invoice_lines.csv
    role: primary
    id_prefix: ""
    columns:
      record_id: line_id
      amount: line_amount
      date: invoice_date       # brief: FX uses the invoice month
      posting_date: posting_date   # fallback when invoice_date is implausible
      supplier_id: vendor_id
      supplier_type: supplier_type
      description: line_description
      item_code: material_number
      quantity: quantity
      currency: currency
      fx_rate: currency_rate
      account: gl_account
      account_desc: gl_account_description
      cost_centre: cost_centre
      po_number: po_number
      po_line: po_line
      invoice_number: invoice_number
      document_type: document_type
      site: plant
    date_formats: ["%Y-%m-%d"]
    amount:
      gross: false

# Invoice dates outside the window, or > 2 years from the posting date, are
# flagged DATE_IMPLAUSIBLE; FX then uses the posting month instead.
dates:
  min: "2019-01-01"
  max: "2025-12-31"
  max_gap_days: 730

matching:
  enabled: false
  exact_duplicates: true       # 613 rows identical in every field but line_id

dedup:
  supplier:
    link_by_id: true           # B has vendor ids only, no names
  item:
    no_code: text              # no material number -> cluster descriptions
    text_threshold: 0.9

exclusions:
  non_procurement:
    lexicon: lexicons/non_procurement.yaml   # shared multilingual phrase list
    text_fields: [description]
    # Intercompany: every seed line on these GL descriptions is excluded
    # (364/364) and none is included. Seen: IC05, IC06, ..., "IC Payables",
    # "I/C Payable", "Intercompany - CZ".
    account_desc_patterns:
      - '^IC\d'
      - '^IC\s'
      - '^I/C\b'
      - '^Intercompany\b'
    accounts: []
    supplier_ids: []
